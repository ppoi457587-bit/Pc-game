
name: Windows Cloud PC - AnyDesk (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: System Information
        shell: pwsh
        run: |
          Write-Host "Windows Cloud PC - AnyDesk (Optimized)"
          Write-Host "Computer: $env:COMPUTERNAME"

          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores,
              NumberOfLogicalProcessors

          Get-CimInstance Win32_ComputerSystem |
            Select-Object @{
              Name = "RAM_GB"
              Expression = {
                [math]::Round($_.TotalPhysicalMemory / 1GB, 2)
              }
            }

          Get-CimInstance Win32_VideoController |
            Select-Object Name
